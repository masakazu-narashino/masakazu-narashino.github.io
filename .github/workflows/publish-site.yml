name: Publish official site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the site and refresh public note articles
        shell: bash
        run: |
          mkdir _site
          git archive HEAD | tar -xf - -C _site --exclude=.github --exclude=blog --exclude=update_note.py --exclude=README.md
          if ! python3 update_note.py; then
            echo '::warning::Could not load the public note feed. The note profile link remains available.'
            printf '[]\n' > note_articles.json
          fi
          cp note_articles.json _site/note_articles.json
          test -f _site/index.html
          test ! -e _site/blog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event.repository.name == 'masakazu-narashino.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
